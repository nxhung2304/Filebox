<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#D9D9DE}
a{color:#0B63CE}a:hover{color:#084C9E}
.cmd{display:flex;align-items:center;gap:10px;height:32px;padding:0 12px;border-radius:6px;font-size:13px;color:#1D1D1F}
.cmd-icon{width:16px;display:flex;justify-content:center;color:#6B6B70;flex:none}
.cmd-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11px;color:#6B6B70}
.cmd-on{background:#0B63CE;color:#FFFFFF}
.cmd-on .cmd-icon,.cmd-on .kbd{color:#FFFFFF}
.m{font-weight:700}
</style>
</helmet>
<div style="width: 1000px; height: 640px; box-sizing: border-box; position: relative; background: #F6F6F8; border: 1px solid #C8C8CE; border-radius: 10px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1D1D1F">
<div style="height: 48px; background: #F4F4F6; border-bottom: 1px solid #DCDCE0" aria-hidden="true"></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.10)" aria-hidden="true"></div>

<div role="dialog" aria-modal="true" aria-label="Command palette" style="position: absolute; top: 72px; left: 220px; width: 560px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #C8C8CE; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,0.22); overflow: hidden">
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-bottom: 1px solid #DCDCE0">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6B6B70" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
<input type="text" aria-label="Command or folder" value="term" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #1D1D1F">
<span class="kbd">esc</span>
</label>
<div role="listbox" aria-label="Results" style="padding: 6px; display: flex; flex-direction: column; gap: 1px">
<div role="option" aria-selected="true" class="cmd cmd-on">
<span class="cmd-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l3 3-3 3M8 11.5h5"></path></svg></span>
<span class="cmd-name">Open in <span class="m">Term</span>inal</span><span class="kbd">⌘⌥T</span>
</div>
<div role="option" aria-selected="false" class="cmd">
<span class="cmd-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l3 3-3 3M8 11.5h5"></path></svg></span>
<span class="cmd-name">Open AI Agent Here <span style="color: #6B6B70">— Claude Code in <span class="m">Term</span>inal</span></span><span class="kbd">⌘⇧A</span>
</div>
<div role="option" aria-selected="false" class="cmd">
<span class="cmd-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><path d="M2 6h12"></path></svg></span>
<span class="cmd-name">Settings: Default <span class="m">Term</span>inal…</span><span class="kbd">⌘,</span>
</div>
<div role="option" aria-selected="false" class="cmd">
<span class="cmd-icon" style="color: #2F6FB0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.2l1.5 1.5h6.3a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"></path></svg></span>
<span class="cmd-name"><span class="m">term</span>inal-themes <span style="color: #6B6B70">~/Projects/dotfiles</span></span><span class="kbd">Favorite</span>
</div>
<div role="option" aria-selected="false" class="cmd">
<span class="cmd-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg></span>
<span class="cmd-name">Ghostty <span class="m">term</span>inal config <span style="color: #6B6B70">~/.config/ghostty</span></span><span class="kbd">Recent tab</span>
</div>
</div>
<div style="height: 28px; display: flex; align-items: center; gap: 16px; padding: 0 14px; border-top: 1px solid #DCDCE0; background: #FAFAFB; font-size: 11px; color: #6B6B70">
<span><span class="kbd">↑↓</span> Move</span><span><span class="kbd">↩</span> Run</span><span><span class="kbd">esc</span> Close</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
