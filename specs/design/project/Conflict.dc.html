<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name conflict and copy progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#D9D9DE}
a{color:#0B63CE}a:hover{color:#084C9E}
button{font:inherit;color:inherit;margin:0}
.btn{height:28px;padding:0 14px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:default}
.btn-secondary{background:#FFFFFF;border:1px solid #C8C8CE;color:#1D1D1F}
.cmp-row{display:grid;grid-template-columns:84px minmax(0,1fr) 72px 110px;column-gap:10px;align-items:center;font-size:12px}
</style>
</helmet>
<div style="width: 1000px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #C8C8CE; border-radius: 10px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #1D1D1F; font-size: 13px">

<div style="height: 48px; flex: none; background: #F4F4F6; border-bottom: 1px solid #DCDCE0; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 13px; color: #6B6B70">
<span>~</span><span aria-hidden="true">›</span><span>Projects</span><span aria-hidden="true">›</span><span>blog</span><span aria-hidden="true">›</span><span style="color: #1D1D1F; font-weight: 600">assets</span>
</div>

<div style="flex: 1; position: relative; background: #F6F6F8; display: flex; justify-content: center">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.12)" aria-hidden="true"></div>
<div role="dialog" aria-modal="true" aria-labelledby="conflict-title" style="position: relative; width: 480px; align-self: flex-start; margin-top: 0; box-sizing: border-box; padding: 20px; background: #FFFFFF; border: 1px solid #C8C8CE; border-top: 0; border-radius: 0 0 10px 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.22); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 14px; align-items: flex-start">
<svg width="40" height="40" viewBox="0 0 16 16" fill="none" stroke="#8A8A90" stroke-width="0.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 1.5h5l3.5 3.5v9a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5v-12a.5.5 0 0 1 .5-.5z"></path><path d="M9 1.5V5h3.5"></path></svg>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h2 id="conflict-title" style="margin: 0; font-size: 13px; font-weight: 600; line-height: 1.4">An item named “hero-banner.png” already exists in “assets”.</h2>
<p style="margin: 0; font-size: 12px; color: #6B6B70; line-height: 1.4">Replace it with the one you’re copying, keep both, or skip this item.</p>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: #F6F6F8; border-radius: 6px">
<div class="cmp-row" style="color: #6B6B70"><span>Existing</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">hero-banner.png</span><span style="text-align: right; font-variant-numeric: tabular-nums">412 KB</span><span>Oct 3, 2025</span></div>
<div class="cmp-row"><span style="color: #6B6B70">Copying</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">hero-banner.png</span><span style="text-align: right; font-variant-numeric: tabular-nums">538 KB</span><span>Today 10:14</span></div>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px">
<input type="checkbox" style="margin: 0">
Apply to All <span style="color: #6B6B70">(4 more conflicts)</span>
</label>
<div style="display: flex; gap: 8px; justify-content: flex-end">
<button class="btn btn-secondary" style="margin-right: auto">Stop</button>
<button class="btn btn-secondary">Skip</button>
<button class="btn btn-secondary">Replace</button>
<button class="btn" style="background: #0B63CE; border: 1px solid #0B63CE; color: #FFFFFF; font-weight: 600">Keep Both</button>
</div>
</div>
</div>

<footer style="height: 24px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #F4F4F6; border-top: 1px solid #DCDCE0; font-size: 11px; color: #6B6B70">
<span>18 items</span>
<span style="display: flex; align-items: center; gap: 8px; color: #1D1D1F">
Copying 3/12 · 45 MB of 120 MB
<span role="progressbar" aria-label="Copy progress" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100" style="width: 120px; height: 4px; border-radius: 2px; background: #DCDCE0; overflow: hidden; display: block"><span style="display: block; width: 38%; height: 100%; background: #0B63CE"></span></span>
<button aria-label="Cancel copy" style="width: 16px; height: 16px; border: 0; padding: 0; background: transparent; color: #6B6B70; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4"></path></svg></button>
</span>
<span style="margin-left: auto">184 GB available</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
